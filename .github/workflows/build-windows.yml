name: Build Windows portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.py"
      - "watermark_engine.py"
      - "Windows版/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "watermark_engine.py"
      - "Windows版/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 10/11 portable package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Windows版/requirements-build.txt"

      - name: Install build dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r "Windows版/requirements-build.txt"

      - name: Validate Python sources
        shell: pwsh
        run: python -m compileall -q app.py watermark_engine.py "Windows版/windows_app.py"

      - name: Build AiMarkTool.exe
        shell: pwsh
        run: >
          pyinstaller
          --noconfirm
          --clean
          --distpath "${{ runner.temp }}\dist"
          --workpath "${{ runner.temp }}\pyinstaller-build"
          "Windows版/AiMarkTool.spec"

      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          $asset = $release.assets |
            Where-Object { $_.name -eq "ffmpeg-master-latest-win64-gpl.zip" } |
            Select-Object -First 1
          if (-not $asset) {
            throw "Expected FFmpeg Windows asset was not found in the latest release."
          }

          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive

          if ($asset.digest -and $asset.digest.StartsWith("sha256:")) {
            $expected = $asset.digest.Substring(7).ToLowerInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "FFmpeg archive SHA-256 verification failed."
            }
            "Verified FFmpeg SHA-256: $actual"
          } else {
            throw "GitHub Releases API did not provide an SHA-256 digest."
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extracted"
          Expand-Archive -Path $archive -DestinationPath $extractDir
          $ffmpeg = Get-ChildItem $extractDir -Recurse -Filter "ffmpeg.exe" |
            Select-Object -First 1
          $ffprobe = Get-ChildItem $extractDir -Recurse -Filter "ffprobe.exe" |
            Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "FFmpeg archive does not contain ffmpeg.exe and ffprobe.exe."
          }

          $portableDir = Join-Path $env:RUNNER_TEMP "Windows版"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "${{ runner.temp }}\dist\AiMarkTool.exe" $portableDir
          Copy-Item $ffmpeg.FullName $portableDir
          Copy-Item $ffprobe.FullName $portableDir
          Copy-Item "Windows版\README.md" $portableDir
          Copy-Item "Windows版\THIRD-PARTY-NOTICES.txt" $portableDir

      - name: Smoke-test packaged binaries
        shell: pwsh
        run: |
          $portableDir = Join-Path $env:RUNNER_TEMP "Windows版"
          & (Join-Path $portableDir "ffmpeg.exe") -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe smoke test failed." }
          & (Join-Path $portableDir "ffprobe.exe") -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "ffprobe.exe smoke test failed." }
          if (-not (Test-Path (Join-Path $portableDir "AiMarkTool.exe"))) {
            throw "AiMarkTool.exe was not produced."
          }

      - name: Create Windows版.zip
        shell: pwsh
        run: |
          $portableDir = Join-Path $env:RUNNER_TEMP "Windows版"
          $zipPath = Join-Path $env:RUNNER_TEMP "Windows版.zip"
          Compress-Archive -Path "$portableDir\*" -DestinationPath $zipPath -Force
          "WINDOWS_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows版.zip
        uses: actions/upload-artifact@v4
        with:
          name: Windows版
          path: ${{ env.WINDOWS_ZIP }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
